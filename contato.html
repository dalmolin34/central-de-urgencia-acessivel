<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoVida | Contato</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo"><div class="container cabecalho">
    <h1>🌱 EcoVida</h1>
    <nav aria-label="Menu principal">
      <a href="index.html">Início</a><a href="sobre.html">Sobre</a>
      <a href="reciclagem.html">Reciclagem</a><a href="contato.html" aria-current="page">Contato</a>
    </nav>
  </div></header>

  <main class="container pagina">
    <p class="destaque-menor">Fale com a gente</p>
    <h2>Contato</h2>
    <p>Tem uma sugestão para ajudar o meio ambiente? Preencha os campos abaixo.</p>
    <form class="formulario">
      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" placeholder="Digite seu nome">
      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" placeholder="Digite seu e-mail">
      <label for="mensagem">Mensagem</label>
      <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem"></textarea>
      <button type="button">Enviar (demonstração)</button>
    </form>
    <p class="observacao">Este formulário é demonstrativo e ainda não envia mensagens.</p>
  </main>

  <footer><p>© 2026 EcoVida - Projeto de conscientização ambiental.</p></footer>
</body>
</html>
